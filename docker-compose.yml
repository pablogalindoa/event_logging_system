services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: event_logging_test
      POSTGRES_USER: event_logging
      POSTGRES_PASSWORD: event_logging
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_logging -d event_logging_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: event_logging_test
      DB_USERNAME: event_logging
      DB_PASSWORD: event_logging
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
